plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mixingradle'

//@formatter:off
dependencyResolutionManagement.versionCatalogs.register('libs') {
    plugin 'licenser',       'net.minecraftforge.licenser'    version '1.2.0'
    plugin 'gradleutils',    'net.minecraftforge.gradleutils' version '3.3.21'
    plugin 'gitversion',     'net.minecraftforge.gitversion'  version '3.1.6'
    plugin 'changelog',      'net.minecraftforge.changelog'   version '3.1.3'

    // Gradle API
    version 'gradle', '6.6'
    library 'gradle', 'name.remal.gradle-api', 'gradle-api'  versionRef 'gradle'

    library 'guava', 'com.google.guava', 'guava' version '21.0'

    library 'asm-tree', 'org.ow2.asm', 'asm-tree' version '9.2'
}
//@formatter:on
